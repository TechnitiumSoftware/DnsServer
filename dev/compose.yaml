# Harness de desarrollo de technitium-ui. NO es el compose de producción de
# upstream (ese es ../docker-compose.yml y no se toca).
#
#   dev  -> imagen oficial + nuestro www/ montado encima  -> 127.0.0.1:5380
#   ref  -> imagen oficial intacta (consola de upstream)  -> 127.0.0.1:5381
#
# Sin puerto 53 (systemd-resolved lo ocupa en WSL) y sin DHCP: aquí solo se
# prueba la consola web.
services:
  dev:
    container_name: technitium-ui-dev
    image: docker.io/technitium/dns-server:latest
    ports:
      - "127.0.0.1:5380:5380/tcp"
    environment:
      - DNS_SERVER_DOMAIN=dev.technitium-ui.test
      - DNS_SERVER_ADMIN_PASSWORD=technitium-ui-dev
    volumes:
      - ../DnsServerCore/www:/opt/technitium/dns/www:ro
      - dev-config:/etc/dns
    restart: unless-stopped

  ref:
    container_name: technitium-ui-ref
    image: docker.io/technitium/dns-server:latest
    ports:
      - "127.0.0.1:5381:5380/tcp"
    environment:
      - DNS_SERVER_DOMAIN=ref.technitium-ui.test
      - DNS_SERVER_ADMIN_PASSWORD=technitium-ui-dev
    volumes:
      - ref-config:/etc/dns
    restart: unless-stopped

  # Sólo para revisar los 9 diálogos de Cluster, que sin un segundo nodo no se
  # pueden ni abrir. NO se usa `ref` para esto: unirlo a un cluster sincroniza su
  # configuración con la del primario y lo inutiliza como referencia de upstream.
  nodo2:
    container_name: technitium-ui-nodo2
    image: docker.io/technitium/dns-server:latest
    ports:
      - "127.0.0.1:5382:5380/tcp"
    environment:
      - DNS_SERVER_DOMAIN=nodo2.technitium-ui.test
      - DNS_SERVER_ADMIN_PASSWORD=technitium-ui-dev
    volumes:
      # También con la consola nueva: los diálogos «Promote To Primary» y
      # «Edit Node» del primario SÓLO existen desde la consola de un secundario.
      - ../DnsServerCore/www:/opt/technitium/dns/www:ro
      - nodo2-config:/etc/dns
    restart: unless-stopped

volumes:
  dev-config:
  ref-config:
  nodo2-config:
